services:
  ivoyager-web:
    build: .
    container_name: ivoyager-web
    restart: unless-stopped
    ports:
      - "8080:80"

  ivoyager-ticker-ws:
    build: ./websocket-server
    container_name: ivoyager-ticker-ws
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
